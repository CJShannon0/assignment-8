#workflow name
name: CI homework run tests

#triggers
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

#jobs
jobs:
#job 1: get code, install node.js,
# install dependencies, run tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test